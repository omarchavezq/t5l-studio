name: Informar un fallo
description: Algo no funciona como debería
labels: [fallo]
body:
  - type: input
    id: version
    attributes:
      label: Versión de T5L Studio
      placeholder: "0.3.0, instalada / navegador"
    validations:
      required: true
  - type: input
    id: pantalla
    attributes:
      label: Pantalla DWIN
      placeholder: "DMG80480C070_04W, 800×480"
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Importar el proyecto…\n2. Pulsar Simular…"
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Qué esperaba y qué pasó
    validations:
      required: true
  - type: textarea
    id: adjuntos
    attributes:
      label: Capturas o archivos
      description: Arrastre aquí capturas, el .dgusx o un DWIN_SET mínimo sin datos privados.
