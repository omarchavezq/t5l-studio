# Comprobación en cada push y pull request: tipos, pruebas y build.
# Las pruebas con proyectos reales (DGUS_SAMPLES) solo corren en local.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      - run: npm audit --omit=dev --audit-level=high
